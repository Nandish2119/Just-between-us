const stage=document.getElementById('stage');
art.forEach((src,i)=>{const im=document.createElement('img');im.className='scene'+(i===0?' active':'');im.src=src;im.alt='Illustrated scene '+(i+1);im.id='scene'+i;stage.appendChild(im)});
const state={screen:0};
function hotspot(label,x,y,w,h,fn){const b=document.createElement('button');b.className='hotspot';b.setAttribute('aria-label',label);b.style.cssText=`left:${x}%;top:${y}%;width:${w}%;height:${h}%`;b.onclick=fn;stage.appendChild(b);return b}
function show(n){state.screen=n;document.querySelectorAll('.scene').forEach((el,i)=>el.classList.toggle('active',i===n));stage.querySelectorAll('.hotspot').forEach(e=>e.remove());stage.querySelectorAll('.extra').forEach(e=>e.remove());
 // Invisible tap targets sit directly over the buttons/speech bubbles in the illustration.
 if(n===0){hotspot('Yes, sure',7,77,45,8,()=>show(4));hotspot('Hmm, not now',53,77,42,8,()=>show(1));}
 if(n===1){hotspot('Okay fine, I will listen',42,4,52,13,()=>show(2));hotspot('Still no',36,44,54,13,()=>show(2));}
 if(n===2){hotspot('Okay, go ahead',27,8,65,12,()=>show(4));hotspot('I would rather not',43,42,50,14,()=>show(3));}
 if(n===3){hotspot('Finish',0,0,100,100,()=>{});}
 if(n===4){hotspot('Yes, I am okay with that',5,83,90,7,()=>show(6));hotspot('I do not think so',10,91,80,7,()=>show(5));}
 if(n===5){hotspot('Goodbye',0,0,100,100,()=>{});}
 if(n===6){hotspot('Read my message',18,82,70,10,()=>show(7));}
 if(n===7){const wrap=document.createElement('div');wrap.className='extra';wrap.style.display='flex';wrap.innerHTML='<button id="confirmYes">Yes, I'm okay with that 💌</button><button class="secondary" id="confirmNo">I'd rather not answer 🤍</button>';stage.appendChild(wrap);document.getElementById('confirmYes').onclick=saveConfirmation;document.getElementById('confirmNo').onclick=()=>show(3);}
}

  apiKey: "AIzaSyAop-iJuRaoDRnVmxCE_bLgINaINnBQXyk",
  authDomain: "just-between-us-4eecd.firebaseapp.com",

};
let firebaseReady=false;
try{if(window.firebase){firebase.initializeApp(firebaseConfig);firebase.firestore();firebaseReady=true}}catch(e){console.warn('Firebase setup issue',e)}
async function saveConfirmation(){
 const yes=document.getElementById('confirmYes'); if(yes){yes.disabled=true;yes.textContent='Sending… 💗'}
 try{
   if(!firebaseReady) throw new Error('Firebase SDK not loaded');
   await firebase.firestore().collection('friendshipConfirmations').add({confirmation:'yes',message:'I am okay with getting closer as friends',createdAt:firebase.firestore.FieldValue.serverTimestamp()});
   showNotice('Thank you for letting me know 💗 Your confirmation was saved.');
 }catch(err){console.error(err);if(yes){yes.disabled=false;yes.textContent='Yes, I'm okay with that 💌'}showNotice('I couldn’t save the confirmation yet. Please check the Firebase setup and try again.');}
}
function showNotice(text){const old=stage.querySelector('.notice');if(old)old.remove();const n=document.createElement('div');n.className='notice';n.style.display='flex';n.innerHTML=`<div class="card"><div style="font-size:28px">🐧💗🐧</div><p>${text}</p><button id="closeNotice">Okay</button></div>`;stage.appendChild(n);n.querySelector('button').onclick=()=>n.remove()}
show(0);
</script>
