
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#302b55">
<title>Just Between Us 🐧💗</title>
<style>
:root{--ink:#45364e;--pink:#f5a9c2;--cream:#fff4d9}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"Trebuchet MS","Segoe UI",sans-serif}
body{min-height:100svh;display:grid;place-items:center;overflow-x:hidden;padding:14px;background:#28284b;color:var(--ink)}
body::before{content:"";position:fixed;inset:0;z-index:-3;background:radial-gradient(ellipse at 50% 73%,#ffad91 0%,#ed8da1 19%,transparent 48%),linear-gradient(180deg,#252447 0%,#42406e 32%,#a36d99 58%,#f5a58d 78%,#433958 100%);transition:background .6s}
body::after{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;opacity:.9;background:radial-gradient(ellipse at 50% 100%,#171d39 0 7%,transparent 42%),radial-gradient(circle at 12% 16%,#fff7d9 0 1px,transparent 2px),radial-gradient(circle at 77% 12%,#fff7d9 0 1.5px,transparent 2.5px),radial-gradient(circle at 88% 31%,#fff7d9 0 1px,transparent 2px),radial-gradient(circle at 24% 35%,#fff7d9 0 1px,transparent 2px),linear-gradient(180deg,transparent 0 66%,#1d2742 66% 100%)}
body.scene-night::before{background:radial-gradient(ellipse at 50% 82%,#fa9d91 0%,#c56e91 20%,transparent 46%),linear-gradient(180deg,#171d3d 0%,#37345e 40%,#754c7e 66%,#ed8d8b 84%,#242743 100%)}
body.scene-last::before{background:radial-gradient(ellipse at 50% 79%,#ed9b91 0%,#bd7399 25%,transparent 48%),linear-gradient(180deg,#1c2344 0%,#35375f 42%,#85537f 67%,#ed9c91 85%,#252743 100%)}
body.scene-letter::before{background:radial-gradient(ellipse at 50% 72%,#ffd6a0 0%,#f5a2a0 22%,transparent 50%),linear-gradient(180deg,#52436d 0%,#a76d91 45%,#f8b09a 72%,#53415c 100%)}
body.scene-end::before{background:radial-gradient(ellipse at 50% 75%,#ffd7a3 0%,#f0a1a9 22%,transparent 48%),linear-gradient(180deg,#433c68 0%,#9a6b91 45%,#f6b5a3 75%,#433751 100%)}
.skyline{position:fixed;z-index:-1;left:0;right:0;bottom:0;height:28vh;min-height:145px;pointer-events:none;background:linear-gradient(90deg,transparent 0 3%,#222744 3% 6%,transparent 6% 9%,#242742 9% 14%,transparent 14% 17%,#242742 17% 20%,transparent 20% 24%,#222744 24% 28%,transparent 28% 31%,#202541 31% 36%,transparent 36% 40%,#252843 40% 44%,transparent 44% 48%,#222744 48% 54%,transparent 54% 57%,#252843 57% 62%,transparent 62% 66%,#222744 66% 71%,transparent 71% 74%,#222744 74% 79%,transparent 79% 83%,#222744 83% 89%,transparent 89% 93%,#222744 93% 97%,transparent 97%),linear-gradient(180deg,transparent 0 42%,#252844 42% 100%);opacity:.95}
.skyline:after{content:"";position:absolute;left:0;right:0;bottom:0;height:100%;background:repeating-linear-gradient(90deg,transparent 0 21px,#ffd78c 22px 24px,transparent 25px 38px);mask-image:linear-gradient(180deg,transparent 0 35%,#000 35% 100%);opacity:.4}
.branch{position:fixed;top:-28px;left:-18px;z-index:0;width:43vw;height:160px;pointer-events:none;border-top:10px solid #28263f;border-radius:0 0 70% 0;transform:rotate(8deg);filter:drop-shadow(0 3px 2px #1b1b34)}
.branch:before,.branch:after{content:"";position:absolute;background:#283044;border-radius:50%;width:70px;height:17px;box-shadow:22px 18px 0 -3px #344052,55px 35px 0 -5px #273047,93px 20px 0 -2px #334054,122px 43px 0 -4px #273047}
.branch:before{top:16px;left:5px;transform:rotate(24deg)}
.branch:after{top:60px;left:72px;transform:rotate(-20deg)}
.lantern{position:fixed;z-index:0;left:5%;top:18%;font-size:clamp(28px,7vw,48px);filter:drop-shadow(0 0 12px #ffc96d);pointer-events:none}
.star{position:fixed;z-index:0;color:#ffe6a5;text-shadow:0 0 10px #ffcf78;pointer-events:none;font-size:20px}
.star.s1{top:10%;right:11%}.star.s2{top:36%;left:13%;font-size:15px}.star.s3{top:48%;right:8%;font-size:14px}
.flowers{position:fixed;bottom:0;left:0;right:0;height:25vh;z-index:0;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-end;overflow:hidden;font-size:clamp(22px,6vw,42px);text-shadow:0 2px 6px #241b38}
.flowers span:nth-child(2),.flowers span:nth-child(4){font-size:clamp(15px,4vw,28px);padding-bottom:26px}
.shell{width:min(100%,470px);position:relative;z-index:1}
.card{position:relative;min-height:min(78svh,720px);display:flex;flex-direction:column;justify-content:center;padding:clamp(20px,5vw,34px);border:2px solid #ffe8d6a8;border-radius:5px;background:linear-gradient(145deg,#fff0cfeF,#ffedc9eF);box-shadow:0 16px 45px #14142c65;text-align:center;overflow:hidden}
.card:before{content:"✿  ·  ♡  ·  ✿";position:absolute;left:10px;right:10px;top:7px;color:#cb879e;font-size:15px;letter-spacing:.4em;opacity:.8}
.card:after{content:"✿  ♡  ✿";position:absolute;left:10px;right:10px;bottom:7px;color:#cb879e;font-size:15px;letter-spacing:.35em;opacity:.75}
.enter{animation:pageIn .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes pageIn{from{opacity:0;transform:translateY(12px) scale(.99);filter:blur(2px)}to{opacity:1;transform:none;filter:blur(0)}}
.penguins{display:flex;justify-content:center;align-items:flex-end;gap:0;margin:8px auto 13px;min-height:78px;max-width:210px}
.penguin{display:inline-block;font-size:clamp(54px,14vw,70px);line-height:1;filter:drop-shadow(0 5px 2px #49304432);animation:bob 3s ease-in-out infinite}
.penguin:nth-child(2){margin-left:-7px;animation-delay:.5s}
@keyframes bob{50%{transform:translateY(-3px)}}
h1{font-family:Georgia,serif;font-weight:normal;font-size:clamp(1.65rem,6vw,2.15rem);line-height:1.22;color:#5b3d55;margin:8px 0 12px}
p{font-size:1rem;line-height:1.65;color:#5e4c56;margin:9px 0}
.note{background:#fff7e5b8;border:1px solid #e9c7b6;border-radius:3px;padding:14px;margin:13px 0;text-align:left}
.note p{font-size:.94rem;color:#5f4b55}
.buttons{display:grid;gap:10px;margin-top:18px}
button{font:inherit;font-weight:650;cursor:pointer;border:0;border-radius:14px;padding:13px 16px;min-height:47px;transition:transform .18s,box-shadow .18s}
button:hover{transform:translateY(-2px);box-shadow:0 7px 16px #a9749160}
button:focus-visible{outline:3px solid #9275cb;outline-offset:3px}
.primary{background:#f3a4be;color:#56384e;border:1px solid #e989a9}
.secondary{background:#fff8ee;color:#67515f;border:1px solid #e2c7cf}
.letter{max-height:38svh;overflow:auto;padding-right:4px}
.status{font-size:.82rem;color:#7d6874;min-height:1.2em;margin-top:8px}
.first-page .progress{display:block}
.progress{display:none;height:3px;background:#f4d8de;border-radius:20px;margin:0 0 13px;overflow:hidden}
.progress span{display:block;height:100%;background:#d8759a;transition:width .45s}
@media(max-width:420px){body{padding:10px}.card{min-height:82svh;padding:23px 18px}.letter{max-height:35svh}.lantern{top:15%}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body class="scene-sunset">
<div class="branch" aria-hidden="true"></div>
<div class="lantern" aria-hidden="true">🏮</div>
<div class="star s1" aria-hidden="true">✦</div>
<div class="star s2" aria-hidden="true">✧</div>
<div class="star s3" aria-hidden="true">✦</div>
<div class="skyline" aria-hidden="true"></div>
<div class="flowers" aria-hidden="true"><span>🌸🌿</span><span>🌼</span><span>🌷🌿</span><span>🌸</span></div>

<main class="shell">
<section class="card enter first-page" id="card" aria-live="polite">
<div class="progress"><span id="progress" style="width:14%"></span></div>
<div class="penguins" aria-label="Two little penguins sitting together"><span class="penguin">🐧</span><span class="penguin">🐧</span></div>
<h1 id="heading"></h1>
<p id="copy"></p>
<div id="note" class="note" hidden></div>
<div class="buttons" id="buttons"></div>
<div class="status" id="status" role="status"></div>
</section>
</main>

<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAop-iJuRaoDRnVmxCE_bLgINaINnBQXyk",
  authDomain: "just-between-us-4eecd.firebaseapp.com",
  projectId: "just-between-us-4eecd",
  storageBucket: "just-between-us-4eecd.firebasestorage.app",
  messagingSenderId: "143912866674",
  appId: "1:143912866674:web:acb42812493a80586cc3eb",
  measurementId: "G-1G5MTD3LZ9"
};

let db = null;
let fbReady = false;
const configured = !!FIREBASE_CONFIG.apiKey &&
                   !!FIREBASE_CONFIG.projectId &&
                   !!FIREBASE_CONFIG.appId;
const $ = id => document.getElementById(id);

function render(title, text, opts = {}) {
  $("card").classList.remove("enter");
  void $("card").offsetWidth;
  $("card").classList.add("enter");
  $("heading").textContent = title;
  $("copy").textContent = text;
  $("note").innerHTML = opts.note || "";
  $("note").hidden = !opts.note;
  $("buttons").innerHTML = "";
  $("status").textContent = "";
  $("card").classList.toggle("first-page", !!opts.first);
  $("progress").style.width = (opts.step || 1) * 14 + "%";
  document.body.className = opts.scene || "scene-sunset";
  $("buttons").style.display = opts.buttons && opts.buttons.length ? "grid" : "none";

  (opts.buttons || []).forEach(item => {
    const button = document.createElement("button");
    button.className = item.kind || "primary";
    button.textContent = item.label;
    button.onclick = () => go(item.to);
    $("buttons").appendChild(button);
  });
  window.scrollTo({top: 0, behavior: "smooth"});
}

const btn = (label, to, kind = "primary") => ({label, to, kind});

function go(screen) {
  if (screen === "start") {
    render("Heyyy, can I ask you something?",
      "It’s just a little something I’ve been wanting to ask you. Nothing scary, promise 🤞",
      {first:true, scene:"scene-sunset", step:1, buttons:[
        btn("Yess, sure :) 💗","question"),
        btn("Hmm... not now 🙈","detour","secondary")
      ]});
  } else if (screen === "detour") {
    render("Awww… not now? 🥺",
      "That’s okayyy! 💗 I don’t want to make you uncomfortable.",
      {scene:"scene-night",step:2,
       note:"<p>But what if you still hear me out? 💗</p>",
       buttons:[
        btn("Okay fine, I’ll listen 🥹","last"),
        btn("I’d still rather not 🤍","last","secondary")
      ]});
  } else if (screen === "last") {
    render("Last chanceee…? 🥺",
      "Can I just ask you this one time? If you’re not comfortable, it’s completely okay!! 💗",
      {scene:"scene-last",step:3,buttons:[
        btn("Okayy, go ahead 🧡","question"),
        btn("I’d still rather not 🤍","goodbye","secondary")
      ]});
  } else if (screen === "question") {
    render("Yayy! 💗",
      "So here it is… Would you be okay with us getting a little closer as friends? 🌼",
      {scene:"scene-letter",step:4,
       note:"<p>Just talking more, getting to know each other better, sharing thoughts, and making more memories. Nothing more than what you’re comfortable with, of course. 💗</p>",
       buttons:[
        btn("Yeah, I’d be okay with that 💗","confession"),
        btn("I don’t think so 🙈","respect","secondary")
      ]});
  } else if (screen === "confession") {
    render("First of all… thank youuu! 🥹💗","Okay, so here it goes… 🙈",
      {scene:"scene-letter",step:5,
       note:`<div class="letter">
<p>I find you really cute, and honestly, I can't quite explain why. There's just something about you that caught my attention. 🌷✨</p>
<p>I just wanted to talk to you and have one of those long conversations where we lose track of time. You know, the kind where one conversation turns into hours without even realizing it. ☁️💗</p>
<p>I first felt like talking to you during the trip itself, but somehow, it never happened. And that's why I'm asking you now. 😊</p>
<p>I know this might sound like a dialogue straight out of a movie 😂, but you're the one who dragged me this far! And somehow, you gave me a different kind of energy because I've found other girls cute too, but I never really felt this same urge to go up to them and start a conversation. With you, it just felt different. 🌸💗</p>
<p>Sooo yeah, that's pretty much it! I just wanted to be honest with you and say what was on my mind. No expectations, no pressure, and nothing you need to feel awkward about. I just wanted you to know. :) 💗</p>
<p style="text-align:center">That's all I wanted to say… thank you for reading this. 🐧💌</p>
</div>`,
       buttons:[btn("Read my message 💌","confirm")]});
  } else if (screen === "confirm") {
    render("One tiny thing before you go… 💗",
      "If you're comfortable with getting closer as friends, you can let me know here. No pressure at all. 🌷",
      {scene:"scene-end",step:6,
       note:"<p>Press this only if you want to confirm that you’re okay with becoming closer friends. This will send that confirmation to me. 💌</p>",
       buttons:[
        btn("Yes, I'm okay with that 💌","save"),
        btn("I'd rather not answer 🤍","end","secondary")
      ]});
  } else if (screen === "save") {
    saveYes();
  } else if (screen === "respect") {
    render("It's okay, really. 🤍",
      "I completely respect your decision. Thank you for being honest with me. I hope you have a bright future, with lots of happiness and amazing moments. ✨",
      {scene:"scene-night",step:7,
       note:"<p>You'll be my one unsuccessful wish, but that's mine to carry. 💗</p><p style='text-align:center'>Byeeee ❤️</p>",
       buttons:[]});
  } else if (screen === "goodbye") {
    render("That's totally okay. 🤍",
      "Thank you for your time. Have a nice day, take care and keep smiling! 🌼",
      {scene:"scene-end",step:7,
       note:'<p style="text-align:center">Byeeee ❤️</p>',buttons:[]});
  } else if (screen === "end") {
    render("Thank you for being here 🌙",
      "Whatever your answer, thank you for taking a moment to be here. Take careee! 💗",
      {scene:"scene-end",step:7,buttons:[]});
  }
}

async function saveYes() {
  render("Thank you for letting me know 💗","Your answer is being saved…",
    {scene:"scene-end",step:7});

  if (!configured || !fbReady || !db) {
    $("status").textContent = "Firebase is not connected. The confirmation was not sent.";
    $("buttons").style.display = "grid";
    const button = document.createElement("button");
    button.className = "secondary";
    button.textContent = "Finish 🌷";
    button.onclick = () => go("end");
    $("buttons").appendChild(button);
    return;
  }

  try {
    await db.collection("friendshipConfirmations").add({
      confirmation: "yes",
      message: "I am okay with getting closer as friends",
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    render("A little confirmation sent 💌",
      "Thank you for being honest with me. I'm glad you let me know. 🌷",
      {scene:"scene-end",step:7,
       note:'<p style="text-align:center">Have a lovely dayyy! 💗</p>',
       buttons:[]});
  } catch (error) {
    render("Oops, that didn’t go through 🤍",
      "The confirmation couldn't be sent just now. Please try again if you'd like.",
      {scene:"scene-end",step:7,buttons:[btn("Try again 💌","save")]});
  }
}

go("start");

if (configured) {
  const appScript = document.createElement("script");
  appScript.src = "https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js";
  appScript.onload = () => {
    const firestoreScript = document.createElement("script");
    firestoreScript.src = "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js";
    firestoreScript.onload = () => {
      try {
        firebase.initializeApp(FIREBASE_CONFIG);
        db = firebase.firestore();
        fbReady = true;
      } catch (error) {
        console.error(error);
      }
    };
    document.head.appendChild(firestoreScript);
  };
  document.head.appendChild(appScript);
}
</script>
</body>
</html>
